name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE: /uia-booth-web/
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - name: 경로별 index.html 복사 (NFC 태그와 공유 주소가 200으로 열리게 함)
        run: |
          for d in nfc nfc/1 nfc/2 nfc/3 nfc/s nfc/admin words visit activities projects people photos \
            activities/chuncheon activities/sagape activities/gyeongju activities/kintex \
            projects/cc-soyang projects/cc-bomnaerun projects/cc-volumeup projects/cc-salon projects/sg-forum-poster projects/sg-session projects/sg-booth projects/gj-hanyang projects/gj-korea projects/gj-seoulwu projects/gj-handong \
            people/1 people/2 people/3 people/4 people/5 people/6 people/7 people/8 people/9 people/10 people/11 people/12 people/13 people/14 people/15 people/16; do
            mkdir -p dist/$d && cp dist/index.html dist/$d/index.html
          done
      - name: 이전 형식 증서 공유 주소(nfc/s/코드)도 200으로 열리게 함
        run: |
          while read -r t; do [ -n "$t" ] && mkdir -p dist/nfc/s/$t && cp dist/index.html dist/nfc/s/$t/index.html; done < legacy-share-tokens.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
